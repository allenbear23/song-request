<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin 控制台</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
      padding: 25px;
    }

    h1 {
      color: #ffcc00;
      margin-bottom: 15px;
    }

    .btn {
      padding: 10px 20px;
      margin: 8px;
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      color: #ffcc00;
      font-size: 16px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #333;
      transform: scale(1.03);
    }

    #queueBox {
      margin-top: 25px;
      padding: 15px;
      background: #1a1a1a;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .song-item {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    .song-item:last-child {
      border-bottom: none;
    }

    .empty {
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>🎛 Admin 控制台</h1>

  <button class="btn" onclick="savePlaylist()">💾 儲存歌單</button>
  <button class="btn" onclick="loadPlaylist()">📂 載入歌單</button>
  <button class="btn" onclick="clearPlaylist()">🗑 清空歌單</button>

  <div id="queueBox">
    <h2>📜 已點歌單</h2>
    <div id="queueList" class="empty">載入中...</div>
  </div>

  <script>
    function savePlaylist() {
      fetch('/playlist/save', { method: 'POST' })
        .then(r => r.json())
        .then(() => alert("✔ 歌單已儲存"));
    }

    function loadPlaylist() {
      fetch('/playlist/load', { method: 'POST' })
        .then(r => r.json())
        .then(() => alert("📂 歌單已載入"));
    }

    function clearPlaylist() {
      fetch('/playlist/clear', { method: 'POST' })
        .then(r => r.json())
        .then(() => alert("🗑 已清空歌單"));
    }

    // 更新 Queue 顯示
    function refreshQueue() {
      fetch('/queue')
        .then(r => r.json())
        .then(queue => {
          const box = document.getElementById('queueList');
          if (queue.length === 0) {
            box.innerHTML = '<div class="empty">目前沒有歌曲</div>';
            return;
          }

          box.innerHTML = queue.map((s, i) => `
            <div class="song-item">
              <b>#${i + 1}</b> — ${s.title}
            </div>
          `).join('');
        });
    }

    // 每 3 秒更新一次
    setInterval(refreshQueue, 3000);
    refreshQueue();
  </script>

</body>
</html>
