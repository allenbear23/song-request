<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>後台管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 20px; background: #111; color: #eee; }
h1 { border-bottom: 1px solid #333; padding-bottom: 10px; }
.card { background: #222; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
label { display: block; margin-bottom: 8px; font-weight: bold; }
input { padding: 8px; width: 100px; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; }
button { padding: 8px 16px; background: #007bff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: #0056b3; }
.msg { margin-top: 10px; color: #4caf50; }
.queue-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; background: #1a1a1a; }
.queue-item:first-child { background: #2a2a2a; border-left: 4px solid #4caf50; }
.btn-sm { padding: 4px 8px; font-size: 12px; margin-left: 4px; }
.btn-del { background: #dc3545; } .btn-del:hover { background: #c82333; }
</style>
</head>
<body>

<h1>⚙️ 系統設定</h1>

<div class="card">
  <h3>投票切歌設定</h3>
  <label>切歌門檻 (票數)</label>
  <div style="display:flex; gap:10px; margin-bottom:15px;">
    <input type="number" id="thresholdInput" min="1" value="3">
    <button onclick="saveThreshold()">儲存設定</button>
  </div>

  <label>切歌停權時間 (分鐘)</label>
  <div style="display:flex; gap:10px;">
    <input type="number" id="banDurationInput" min="1" value="5">
    <button onclick="saveBanDuration()">儲存設定</button>
  </div>
  <div id="msg" class="msg"></div>
</div>

<div class="card">
  <h3>🎵 播放佇列管理</h3>
  <div style="margin-bottom:10px; display:flex; gap:10px;">
    <button onclick="refreshQueue()">🔄 重新整理</button>
  </div>
  
  <!-- 切歌控制區 -->
  <div style="background:#2a2a2a; padding:10px; border-radius:6px; margin-bottom:10px; border:1px solid #444;">
    <label>切歌原因 (選填)</label>
    <input type="text" id="skipReason" style="width:100%; box-sizing:border-box; margin-bottom:8px;" placeholder="例如：版權問題、太難聽...">
    <label>上傳圖片 (選填)</label>
    <input type="file" id="skipImage" accept="image/*" style="width:100%; margin-bottom:8px;">
    <button onclick="skipWithReason()" style="background:#ff4444; width:100%;">⏭ 強制切歌並顯示訊息</button>
  </div>

  <div id="adminQueueList"></div>
</div>

<div class="card">
  <h3>🚫 停權名單管理</h3>
  <div style="margin-bottom:10px;">
    <button onclick="refreshBannedList()">🔄 重新整理名單</button>
  </div>
  <div id="bannedList"></div>
</div>

<div class="card">
  <h3>其他功能</h3>
  <p>
    <a href="/display.html" target="_blank" style="color:#4da3ff">開啟播放頁面</a> | 
    <a href="/" target="_blank" style="color:#4da3ff">開啟點歌頁面</a>
  </p>
</div>

<script>
  // 載入目前設定
  fetch('/settings')
    .then(r => r.json())
    .then(data => {
      document.getElementById('thresholdInput').value = data.threshold;
      if (data.banDuration) document.getElementById('banDurationInput').value = data.banDuration;
    });

  function saveThreshold() {
    const val = document.getElementById('thresholdInput').value;
    fetch('/admin/threshold', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ threshold: val })
    })
    .then(r => r.json())
    .then(data => {
      if(data.ok) document.getElementById('msg').innerText = "✅ 設定已更新為 " + data.threshold + " 票";
      else alert(data.error);
    })
    .catch(err => alert("儲存失敗"));
  }

  function saveBanDuration() {
    const val = document.getElementById('banDurationInput').value;
    fetch('/admin/ban-duration', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ banDuration: val })
    })
    .then(r => r.json())
    .then(data => {
      if(data.ok) document.getElementById('msg').innerText = "✅ 停權時間已更新為 " + data.banDuration + " 分鐘";
      else alert(data.error);
    })
    .catch(err => alert("儲存失敗"));
  }

  // --- 佇列管理功能 ---
  function refreshQueue() {
    fetch('/queue')
      .then(r => r.json())
      .then(q => renderQueue(q));
  }

  function renderQueue(q) {
    const list = document.getElementById('adminQueueList');
    list.innerHTML = '';
    if(q.length === 0) {
      list.innerHTML = '<div style="color:#777; padding:10px;">目前沒有歌曲</div>';
      return;
    }
    
    q.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'queue-item';
      
      // 標題區
      const info = document.createElement('div');
      if (idx === 0) {
        info.innerHTML = `<span style="color:#4caf50; font-weight:bold">▶ 正在播放：</span> ${item.title}`;
      } else {
        info.innerText = `${idx}. ${item.title}`;
      }
      
      // 按鈕區
      const actions = document.createElement('div');
      
      // 只有排隊中的歌曲 (index > 0) 可以移動或刪除
      if (idx > 0) {
        // 上移 (如果不是第一首排隊歌曲)
        if (idx > 1) {
          actions.innerHTML += `<button class="btn-sm" onclick="moveItem(${idx}, ${idx-1})">⬆</button>`;
        }
        // 下移 (如果不是最後一首)
        if (idx < q.length - 1) {
          actions.innerHTML += `<button class="btn-sm" onclick="moveItem(${idx}, ${idx+1})">⬇</button>`;
        }
        // 刪除
        actions.innerHTML += `<button class="btn-sm btn-del" onclick="deleteItem(${idx})">❌</button>`;
      }
      
      div.appendChild(info);
      div.appendChild(actions);
      list.appendChild(div);
    });
  }

  // 帶原因與圖片的切歌
  function skipWithReason() {
    if(!confirm('確定要強制切歌嗎？')) return;
    
    const reason = document.getElementById('skipReason').value;
    const fileInput = document.getElementById('skipImage');
    const file = fileInput.files[0];
    
    const sendSkip = (base64Image) => {
      fetch('/admin/skip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason, image: base64Image })
      })
      .then(r => r.json())
      .then(data => {
        if(data.ok) {
          alert('已切歌');
          refreshQueue();
          // 清空輸入
          document.getElementById('skipReason').value = '';
          fileInput.value = '';
        } else {
          alert('失敗: ' + (data.error || '未知錯誤'));
        }
      })
      .catch(err => alert('錯誤'));
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) { sendSkip(e.target.result); };
      reader.readAsDataURL(file);
    } else {
      sendSkip(null);
    }
  }

  function deleteItem(idx) { if(confirm('確定要刪除這首歌嗎？')) fetch('/delete/' + idx, { method: 'POST' }).then(refreshQueue); }
  function moveItem(oldIndex, newIndex) {
    fetch('/admin/reorder', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ oldIndex, newIndex }) }).then(refreshQueue);
  }

  // --- 停權管理功能 ---
  function refreshBannedList() {
    const listDiv = document.getElementById('bannedList');
    listDiv.innerHTML = '載入中...';
    
    fetch('/admin/banned-users')
      .then(r => r.json())
      .then(list => {
        listDiv.innerHTML = '';
        if (list.length === 0) {
          listDiv.innerHTML = '<div style="color:#777; padding:10px;">目前沒有被停權的使用者</div>';
          return;
        }
        
        list.forEach(u => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #333; background:#1a1a1a; margin-bottom:5px; border-radius:4px;';
          
          const timeLeft = Math.ceil((u.bannedUntil - Date.now()) / 60000);
          
          row.innerHTML = `
            <div style="display:flex; align-items:center;">
              <img src="${u.picture || 'https://via.placeholder.com/40'}" style="width:40px; height:40px; border-radius:50%; margin-right:10px; object-fit:cover;">
              <div>
                <div style="font-weight:bold; color:#fff;">${u.name || '未知'}</div>
                <div style="font-size:12px; color:#ff4444;">剩餘 ${timeLeft} 分鐘</div>
              </div>
            </div>
            <button onclick="unbanUser('${u.id}')" style="background:#28a745; padding:6px 12px; font-size:13px;">🔓 解禁</button>
          `;
          listDiv.appendChild(row);
        });
      });
  }

  function unbanUser(userId) {
    if(!confirm('確定要解除此人的停權嗎？')) return;
    fetch('/admin/unban', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ userId }) }).then(() => { alert('已解禁'); refreshBannedList(); });
  }

  // 初始載入
  refreshQueue();
  refreshBannedList();
</script>

</body>
</html>
