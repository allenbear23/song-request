<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="utf-8">
  <title>建立專屬房間 - 放歌啦</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="登入 LINE 建立您的放歌啦專屬點歌房間，讓朋友掃碼即刻點歌，派對不間斷！">
  <meta property="og:title" content="建立專屬房間 - 放歌啦">
  <meta property="og:description" content="登入 LINE 建立您的放歌啦專屬點歌房間，讓朋友掃碼即刻點歌，派對不間斷！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://song-request67.onrender.com/create.html">
  <link rel="canonical" href="https://song-request67.onrender.com/create.html" />
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      color: #eee;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #fff;
    }

    .card {
      background: #222;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    input {
      padding: 12px;
      width: 80%;
      font-size: 18px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    .links {
      margin-top: 30px;
      display: none;
      text-align: left;
      border-top: 1px solid #333;
      padding-top: 20px;
    }

    .link-item {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .link-item a {
      color: #4da3ff;
      text-decoration: none;
      font-weight: bold;
      word-break: break-all;
    }

    .link-label {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .btn-copy {
      background: #444;
      font-size: 14px;
      padding: 6px 12px;
      margin-left: 10px;
    }

    .icon {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
      margin-right: 6px;
    }

    h3 .icon {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<!-- 引入 LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<body>

  <svg style="display: none;">
    <defs>
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </symbol>
      <symbol id="icon-rocket" viewBox="0 0 24 24">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2l.5-.5"></path>
        <path d="M12 15l-3-3a22 22 0 0 1-.5-9s-2 1-2 3c0 1.5 1 3.5 2 4.5s3 2 4.5 2c2 0 3-2 3-2s-9-.5-9-.5z"
          fill="currentColor"></path>
        <path d="M14.5 6.5s-1-2 2.5-3.5"></path>
        <circle cx="15.5" cy="8.5" r="1.5"></circle>
      </symbol>
      <symbol id="icon-mic" viewBox="0 0 24 24">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </symbol>
      <symbol id="icon-tv" viewBox="0 0 24 24">
        <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
        <polyline points="17 2 12 7 7 2"></polyline>
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
        <circle cx="12" cy="12" r="3"></circle>
      </symbol>
      <symbol id="icon-book" viewBox="0 0 24 24">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </symbol>
    </defs>
  </svg>

  <h1><svg class="icon" style="width:32px; height:32px;">
      <use href="#icon-home"></use>
    </svg> 建立或加入房間</h1>

  <div class="card">
    <!-- 未登入時顯示 -->
    <div id="loginSection">
      <p style="color:#aaa; margin-bottom:20px;">請先登入 LINE 帳號以建立專屬房間</p>
      <button id="btnLogin" onclick="loginLine()" style="background:#06c755;">LINE 登入</button>
    </div>

    <!-- 登入後顯示 -->
    <div id="createSection" style="display:none;">
      <p style="color:#aaa; margin-bottom:20px;">您已登入，點擊下方按鈕進入您的專屬房間</p>
      <button onclick="createRoom()"
        style="background:#007bff; color:#fff; font-size:20px; padding:15px 40px;">進入我的專屬房間</button>
    </div>

    <div id="resultArea" class="links">
      <h3 style="margin-top:0;"><svg class="icon">
          <use href="#icon-rocket"></use>
        </svg> 房間連結已生成：<span id="roomNameDisplay" style="color:#ffeb3b"></span></h3>

      <div class="link-item">
        <div style="flex:1">
          <div class="link-label"><svg class="icon">
              <use href="#icon-mic"></use>
            </svg> 點歌頁面 (給來賓)</div>
          <a id="guestLink" href="#" target="_blank">...</a>
        </div>
        <button class="btn-copy" onclick="copyLink('guestLink')">複製</button>
      </div>

      <div class="link-item">
        <div style="flex:1">
          <div class="link-label"><svg class="icon">
              <use href="#icon-tv"></use>
            </svg> 播放頁面 (大螢幕)</div>
          <a id="displayLink" href="#" target="_blank">...</a>
        </div>
        <button class="btn-copy" onclick="copyLink('displayLink')">複製</button>
      </div>

      <div class="link-item">
        <div style="flex:1">
          <div class="link-label"><svg class="icon">
              <use href="#icon-settings"></use>
            </svg> 後台管理 (控制台)</div>
          <a id="adminLink" href="#" target="_blank">...</a>
        </div>
        <button class="btn-copy" onclick="copyLink('adminLink')">複製</button>
      </div>
    </div>

    <div
      style="margin-top: 30px; text-align: left; color: #ccc; font-size: 14px; line-height: 1.6; border-top: 1px solid #333; padding-top: 20px;">
      <h3 style="color: #fff; margin-top: 0;"><svg class="icon">
          <use href="#icon-book"></use>
        </svg> 使用說明</h3>
      <ol style="padding-left: 20px; margin: 0;">
        <li><b>登入 LINE</b> 後點擊按鈕。</li>
        <li>系統會自動為您分配一個<b>專屬房間</b>。</li>
        <li>將<b>「點歌頁面」</b>連結分享給朋友，讓大家用手機點歌。</li>
        <li>在電視或大螢幕上開啟<b>「播放頁面」</b>，享受音樂與燈光秀。</li>
      </ol>
    </div>
  </div>

  <script>
    window.APP_CONFIG = {};
    let userProfile = null;

    function initLiff() {
      const btn = document.getElementById('btnLogin');
      
      if (!window.APP_CONFIG || !window.APP_CONFIG.LIFF_ID) {
        console.warn('LIFF ID is not configured. Enabling Guest/Bypass room creation.');
        if (btn) {
          btn.style.background = '#6c757d';
          btn.innerText = "以本地測試管理員身分建立";
          btn.onclick = () => {
            userProfile = {
              userId: 'test_admin_user',
              displayName: '本地測試管理員'
            };
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('createSection').style.display = 'block';
          };
        }
        return;
      }

      if (btn) btn.innerText = "載入中...";

      liff.init({ liffId: window.APP_CONFIG.LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(profile => {
            userProfile = profile;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('createSection').style.display = 'block';
          });
        } else {
          document.getElementById('loginSection').style.display = 'block';

          if (btn) btn.innerText = "LINE 登入";
        }
      }).catch(err => {
        console.error('LIFF Init Error', err);
        alert('LINE 登入初始化失敗');
        if (btn) btn.innerText = "LINE 登入 (重試)";
      });
    }

    function loginLine() {
      // 清除 URL 中的 LINE Login 參數，避免重複帶入導致錯誤
      const url = new URL(window.location.href);
      url.searchParams.delete('code');
      url.searchParams.delete('state');
      url.searchParams.delete('liffClientId');
      url.searchParams.delete('liffRedirectUri');

      liff.login({ redirectUri: url.toString() });
    }

    function createRoom() {
      const baseUrl = window.location.origin;

      if (!userProfile || !userProfile.userId) {
        alert("請先登入 LINE");
        return;
      }

      fetch('/api/room/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adminLineId: userProfile.userId }) // 不傳 room，讓後端自動分配
      })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            const room = data.room;
            // 儲存 ID 到 sessionStorage 方便後台直接識別
            sessionStorage.setItem('line_user_id', userProfile.userId);

            document.getElementById('roomNameDisplay').innerText = room;

            const guestUrl = `${baseUrl}/?room=${encodeURIComponent(room)}`;
            const displayUrl = `${baseUrl}/display.html?room=${encodeURIComponent(room)}`;
            const adminUrl = `${baseUrl}/admin.html?room=${encodeURIComponent(room)}`;

            document.getElementById('guestLink').href = guestUrl;
            document.getElementById('guestLink').innerText = guestUrl;
            document.getElementById('displayLink').href = displayUrl;
            document.getElementById('displayLink').innerText = displayUrl;
            document.getElementById('adminLink').href = adminUrl;
            document.getElementById('adminLink').innerText = adminUrl;

            document.getElementById('resultArea').style.display = 'block';
          } else {
            alert(data.error || "建立失敗");
          }
        });
    }

    function copyLink(id) {
      const url = document.getElementById(id).href;
      navigator.clipboard.writeText(url).then(() => alert('已複製連結！'));
    }

    async function initializeConfig() {
      try {
        const res = await fetch('/api/config');
        window.APP_CONFIG = await res.json();
        initLiff();
      } catch (err) {
        console.error('Failed to load config', err);
        alert('無法取得系統設定，請重新整理頁面。');
      }
    }

    initializeConfig();
  </script>

</body>

</html>
