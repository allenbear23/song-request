<style>
/* 投票 Overlay */

  animation: stampDrop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1.25) forwards;

@keyframes stampDrop {
  0% { opacity: 0; transform: scale(3) translateY(-50px) rotate(-15deg); filter: blur(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); filter: blur(0); }
}

/* 投票成功 Overlay */
#successOverlay {
  display: none;
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 400;
  align-items: center; justify-content: center;
  pointer-events: none; /* 讓點擊穿透，不影響操作 */

  text-align: center;

  box-shadow: 0 0 50px rgba(0,255,0,0.5);

}
@keyframes popIn {

  100% { transform: scale(1); opacity: 1; }
}

/* 舞台燈光特效 */
#stage-lights {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 90;
  box-shadow: inset 0 0 0 rgba(0,0,0,0);
  transition: box-shadow 0.5s ease;
}

/* 跑馬燈樣式 */
#marqueeContainer {
  position: fixed; top: 0; left: 0; width: 100%; height: 50px;
  background: rgba(0,0,0,0.85); z-index: 500;
  display: none; align-items: center; overflow: hidden;
  pointer-events: none; border-bottom: 1px solid #444;
}
#marqueeText {
  display: inline-block; white-space: nowrap;
  font-size: 28px; color: #ffeb3b; font-weight: bold;
  padding-left: 100%;
  animation: marqueeScroll 15s linear infinite;
}
@keyframes marqueeScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* 彈幕樣式 */
#danmaku-container {
  position: fixed; top: 0; left: 0; width: 100%; height: 80%; /* 避開底部 */
  pointer-events: none; z-index: 150; overflow: hidden;
}
.danmaku-item {
  position: absolute;
  white-space: nowrap;
  font-weight: bold;
  text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 2px black;
  font-family: "Microsoft JhengHei", sans-serif;
  will-change: transform;
  opacity: 0.9;
}
.danmaku-item.scroll {
  animation: danmakuMove linear forwards;
}
.danmaku-item.fixed-top {
  left: 50%;
  transform: translateX(-50%);
  animation: fadeOut 4s forwards;
}
.danmaku-item.fixed-bottom {
  left: 50%;
  transform: translateX(-50%);
  animation: fadeOut 4s forwards;
}
@keyframes danmakuMove {
  from { transform: translateX(100vw); }
  to { transform: translateX(-100%); }
}
@keyframes fadeOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

<script>
  // 自動將網址列的 ?room=xxx 參數帶入所有的 API 請求
  (function() {
    const originalFetch = window.fetch;
    window.fetch = function(url, options) {
      const room = new URLSearchParams(window.location.search).get('room') || 'default';
      // 處理相對路徑與絕對路徑
      let urlObj;
      try { urlObj = new URL(url, window.location.origin); } catch(e) { return originalFetch(url, options); }
      if (urlObj.origin !== window.location.origin) return originalFetch(url, options);
      urlObj.searchParams.append('room', room);
      return originalFetch(urlObj.toString(), options);
    };
  })();
</script>
<body>

<script>
let player, currentVideoId = null, voteThreshold = 3, voteTimeout = 60000, currentQueue = [], isVoting = false, lastVoteCount = 0, visualEffectsEnabled = false;

// --- 顏色分析引擎 ---
let lastThumbnailUrl = '', currentThemeHue = 0, useThemeColor = false;
// 新增即時影像擷取變數
let captureVideo = document.createElement('video');
captureVideo.muted = true;
captureVideo.autoplay = true;
captureVideo.playsInline = true;
let colorCtx = null;

function updateThemeColor(url) {
  const img = new Image();
  img.crossOrigin = "Anonymous"; // 嘗試跨域讀取圖片
  img.src = url;
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 1; canvas.height = 1;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 1, 1);
      const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
      
      // RGB 轉 HSL 計算色相 (Hue)
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0;
      if (max !== min) {
        const d = max - min;
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      currentThemeHue = h * 360;
      useThemeColor = true;
    } catch (e) {
      console.warn("無法提取封面顏色 (CORS 限制):", e);
      useThemeColor = false;
    }
  };
  img.onerror = () => { useThemeColor = false; };
}

// --- 音效引擎 (Web Audio API) ---
let audioCtx, gainNode, analyser, dataArray;

function initAudio() {
  const audio = document.getElementById('voteSound');
  if (!audio) return;

  // 1. 初始化 AudioContext (只做一次)
  if (!audioCtx) {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      const source = audioCtx.createMediaElementSource(audio);
      gainNode = audioCtx.createGain();
      gainNode.gain.value = 4.0; // 音量放大 4 倍
      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    } catch (e) {
      console.error("Web Audio Init Error:", e);
    }
  }

  // 2. 確保 Context 處於運作狀態
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

async function setupVisualizer() {
  try {
    // 改用 getDisplayMedia 直接讀取分頁音訊 (無雜音、高品質)
    // 注意：這會跳出螢幕分享視窗，必須選擇「目前分頁」並勾選「分享音訊」
    const stream = await navigator.mediaDevices.getDisplayMedia({ 
      video: true, // 必須請求 video 才能抓取 tab audio
      audio: true 
    });
    
    // 連接影像串流以進行顏色分析
    captureVideo.srcObject = stream;
    captureVideo.play().catch(e => console.error("影像播放失敗", e));
    
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512; // 解析度
    analyser.smoothingTimeConstant = 0.6; // 降低平滑度讓節奏更強烈
    
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    
  } catch (e) {
    console.error("無法啟用燈光同步 (使用者取消或未分享音訊):", e);
    // 不阻擋流程，只是沒燈光
  }
}

function playVoteSound() {
  const audio = document.getElementById('voteSound');
  if (!audio) return;
  
  initAudio(); // 確保已初始化
  
  audio.currentTime = 0;
  audio.play().catch(e => {
    console.error("播放失敗:", e);
    // 如果 Web Audio 失敗，嘗試直接播放 (雖然可能比較小聲)
  });
}

function extractVideoId(url) {
  const m = url && url.match(/v=([^&]+)/);
  if (m) return m[1];
  const s = url && url.match(/youtu\.be\/([^?&]+)/);
  return s ? s[1] : null;
}

// Load YouTube iframe api
(function(){
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);
})();

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: '',
    playerVars: { autoplay: 1, controls: 1, rel:0 },
    events: {
      onReady: () => checkNext(),
      onStateChange: (e) => {
        // 控制舞台燈光
        if (e.data === YT.PlayerState.PLAYING) {
          startLightShow();
        } else {
          stopLightShow();
        }
        if (e.data === YT.PlayerState.ENDED) {
          fetch('/finish', { method: 'POST' }).then(() => checkNext());
        }
      }
    }
  });
}

function checkNext() {
  fetch('/next').then(r => r.json()).then(data => {
    if (data && data.url) {
      const vid = extractVideoId(data.url);
      if (vid) {
        currentVideoId = vid;
        player.loadVideoById(vid);
      }
    } else {
      // no songs
      document.getElementById('queueList').innerHTML = '<div style="color:#888">目前沒有排隊歌曲</div>';
      if (player && typeof player.stopVideo === 'function') {
        player.stopVideo();
      }
      currentVideoId = null;
    }
    refreshQueueSidebar();
  }).catch(err => console.error('checkNext err', err));
}

function refreshQueueSidebar() {
  // 使用 Promise.all 同時取得 queue 與 settings，並加入錯誤處理與 Cache Busting
  Promise.all([
    fetch('/queue?_=' + Date.now()).then(r => r.json()),
    fetch('/settings').then(r => r.ok ? r.json() : {threshold:3, timeout:60000, visualEffects: false}).catch(() => ({threshold:3, timeout:60000, visualEffects: false}))
  ]).then(([queue, settings]) => {
    voteThreshold = settings.threshold;
    voteTimeout = settings.timeout;
    
    // 更新特效設定
    const effectsOn = settings.visualEffects !== false; // 預設為開啟
    if (visualEffectsEnabled !== effectsOn) {
      visualEffectsEnabled = effectsOn;
      if (!visualEffectsEnabled) stopLightShow();
      else if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === YT.PlayerState.PLAYING) startLightShow();
    }

    currentQueue = queue;
    
    // 偵測封面變更並更新主題色
    if (queue.length > 0) {
      if (queue[0].thumbnail !== lastThumbnailUrl) {
        lastThumbnailUrl = queue[0].thumbnail;
        updateThemeColor(lastThumbnailUrl);
      }
    } else {
      useThemeColor = false;
      lastThumbnailUrl = '';
    }

    // 自動同步播放器：如果佇列第一首跟目前播放的不一樣，就切歌
    if (queue.length > 0) {
      const topVid = extractVideoId(queue[0].url);
      if (currentVideoId && topVid && topVid !== currentVideoId) {
        // 偵測到切歌：如果之前處於投票狀態，播放成功音效
        if (isVoting) {
          playVoteSound();
          showSuccessAnimation();
        }
        checkNext();
      }
    } else if (currentVideoId) {
      checkNext();
    }

    const box = document.getElementById('queueList');
    box.innerHTML = '';
    queue.forEach((it, idx) => {
      const div = document.createElement('div');
      div.className = 'video-card' + (idx === 0 ? ' playing' : '');
      div.innerHTML = `
        <img class="thumbnail" src="${it.thumbnail}" />
        <div class="info">
          <div class="title">${idx === 0 ? '▶ ' : (idx+1) + '. '}${it.title}</div>
          <div class="channel">${it.channel || ''}</div>
          ${idx === 0 && it.votes ? `<div style="color:#ff4444; font-size:12px; margin-top:4px; font-weight:bold;">🗳 ${it.votes}/${voteThreshold} 票切歌</div>` : ''}
        </div>
        <div class="controls">
        </div>
      `;
      box.appendChild(div);
    });

    // 處理投票 Overlay
    const overlay = document.getElementById('voteOverlay');
    if (queue.length > 0 && queue[0].votes > 0) {
      const currentVotes = queue[0].votes;
      if (!isVoting || currentVotes > lastVoteCount) {
        playVoteSound();
      }
      lastVoteCount = currentVotes;
      isVoting = true; // 標記目前正在投票
      overlay.style.display = 'flex';
      document.getElementById('voteStatus').innerText = `${queue[0].votes} / ${voteThreshold}`;
      
      updateVoteTimerUI();
      
      // 設定 QR Code (使用與右下角相同的連結)
      const mainQr = document.getElementById('qrcode');
      if (mainQr) {
        document.getElementById('voteQrImg').src = mainQr.src;
      }
    } else {
      isVoting = false; // 標記無投票
      lastVoteCount = 0;
      overlay.style.display = 'none';
    }

  }).catch(err => console.error('refreshQueue err', err));
}

// 本地倒數計時更新 (每秒)
function updateVoteTimerUI() {
  if (currentQueue.length > 0 && currentQueue[0].votes > 0) {
    const item = currentQueue[0];
    const elapsed = Date.now() - (item.voteStartTime || Date.now());
    const leftMs = Math.max(0, voteTimeout - elapsed);
    const left = Math.ceil(leftMs / 1000);
    
    const el = document.getElementById('voteTimeLeft');
    if (el) el.innerText = left;

    const circle = document.getElementById('voteTimerBar');
    if (circle) {
      circle.style.strokeDashoffset = 283 * (1 - (leftMs / voteTimeout));
    }
  }
}

// periodic
setInterval(() => {
  refreshQueueSidebar();
  // if player exists and paused or stopped, ensure it's playing next
  if (player && typeof player.getPlayerState === 'function') {
    const st = player.getPlayerState();
    if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) {
      // attempt to ensure next is playing
      // but avoid aggressive reload if user paused manually
      // only reload if not playing
      checkNext();
    }
  }
}, 3500);

// 獨立的計時器更新迴圈 (每秒)
setInterval(updateVoteTimerUI, 1000);

// --- 舞台燈光模擬節奏引擎 ---
let lightFrame;
function startLightShow() {
  if (!visualEffectsEnabled) return;
  const lights = document.getElementById('stage-lights');
  const playerContainer = document.getElementById('player-container');

  if (!lights) return;
  lights.style.transition = 'box-shadow 0.05s ease'; // 讓跳動更靈敏
  if (playerContainer) playerContainer.style.transition = 'transform 0.05s ease';
  
  
  function loop() {
    lightFrame = requestAnimationFrame(loop);

    const time = Date.now();
    // 模擬 120 BPM 的重拍 (每 500ms 一次峰值)
    // 使用 sin^6 函數產生尖銳的脈衝感，模擬重低音
    const beat = Math.pow((Math.sin(time / 250 * Math.PI) + 1) / 2, 6);
    
    // 根據螢幕寬度調整強度係數 (基準 1200px，大螢幕會放大效果)
    const sizeFactor = Math.max(1, window.innerWidth / 1200);

    // 隨機強度 + 節奏脈衝 (增強版)
    const intensity = (60 + (beat * 350) + (Math.random() * 30)) * sizeFactor;
    
    // 決定燈光顏色 (使用封面主色 或 彩虹流動)
    let hue = (time / 20) % 360;
    if (useThemeColor) {
      hue = currentThemeHue + Math.sin(time / 2000) * 20; // 在主色附近輕微波動
    }
    
    // 模擬模式的 Strobe 效果 (當 beat 強度 > 0.8 時爆閃)
    if (beat > 0.8) {
      lights.style.boxShadow = `inset 0 0 ${intensity * 1.2}px rgba(255,255,255,0.8), inset 0 0 ${intensity * 2.5}px hsla(${hue}, 100%, 70%, 0.8)`;
    } else {
      lights.style.boxShadow = `inset 0 0 ${intensity}px hsla(${hue}, 90%, 50%, 0.8), inset 0 0 ${intensity * 2}px hsla(${hue}, 90%, 50%, 0.4)`;
    }
    
    // 模擬震動 (無音訊時)
    if (playerContainer) playerContainer.style.transform = `scale(${1 + beat * 0.04})`;

    // --- 即時影像顏色分析 ---
    if (captureVideo && captureVideo.readyState >= 2) {
      if (!colorCtx) {
        const c = document.createElement('canvas');
        c.width = 1; c.height = 1;
        colorCtx = c.getContext('2d', { willReadFrequently: true });
      }
      try {
        // 取畫面中央 50% 區域平均色，避免受邊緣燈光影響
        colorCtx.drawImage(captureVideo, 
          captureVideo.videoWidth * 0.25, captureVideo.videoHeight * 0.25, 
          captureVideo.videoWidth * 0.5, captureVideo.videoHeight * 0.5, 
          0, 0, 1, 1);
        
        const [r, g, b] = colorCtx.getImageData(0, 0, 1, 1).data;
        
        // RGB 轉 HSL
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h = 0;
        if (max !== min) {
          const d = max - min;
          switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
          }
          h /= 6;
        }
        // 平滑更新色相
        const targetHue = h * 360;
        // 簡單緩動，若跨越 0/360 邊界則直接切換
        if (Math.abs(targetHue - currentThemeHue) > 180) {
             currentThemeHue = targetHue;
        } else {
             currentThemeHue += (targetHue - currentThemeHue) * 0.1;
        }
        useThemeColor = true;
      } catch (e) { /* 忽略 */ }
    }

    if (analyser && dataArray) {
      analyser.getByteFrequencyData(dataArray);
      
      // 取低頻 (Bass) 平均值 (前 4 個頻段)
      let bass = 0;
      for(let i=0; i<4; i++) bass += dataArray[i];
      bass = bass / 4;
      
      // 數值正規化與視覺效果
      const level = Math.pow(bass / 255, 2); // 平方讓重拍更明顯
      const intensity = (50 + (level * 600)) * sizeFactor;
      
      if (level > 0.05) {
        // 真實音訊的 Strobe 效果 (當低頻強度 > 0.45 時爆閃)
        if (level > 0.45) {
          lights.style.boxShadow = `inset 0 0 ${intensity * 1.2}px rgba(255,255,255,0.9), inset 0 0 ${intensity * 2.5}px hsla(${hue}, 100%, 60%, 0.9)`;
        } else {
          lights.style.boxShadow = `inset 0 0 ${intensity}px hsla(${hue}, 100%, 50%, 0.9), inset 0 0 ${intensity * 2}px hsla(${hue}, 100%, 50%, 0.5)`;
        }
        // 真實震動 (有音訊時覆蓋模擬，最大放大 1.08 倍)
        if (playerContainer) playerContainer.style.transform = `scale(${1 + level * 0.08})`;
      } else {
        lights.style.boxShadow = 'none';
        if (playerContainer) playerContainer.style.transform = 'scale(1)';
      }
    }
  }
  loop();
}

function stopLightShow() {
  if (lightFrame) cancelAnimationFrame(lightFrame);
  const lights = document.getElementById('stage-lights');
  const playerContainer = document.getElementById('player-container');
  if (lights) {
    lights.style.transition = 'box-shadow 0.5s ease';
    lights.style.boxShadow = 'none';
  }
  if (playerContainer) {
    playerContainer.style.transition = 'transform 0.5s ease';
    playerContainer.style.transform = 'scale(1)';
  }
}
</script>

<script>
// --- 檢查管理員切歌訊息 ---
let lastSkipTime = 0;

function checkSkipMessage() {
  fetch('/skip-message?_=' + Date.now())
    .then(r => r.json())
    .then(msg => {
      if (msg && msg.timestamp && msg.timestamp > lastSkipTime) {
        lastSkipTime = msg.timestamp;
        // 只有 10 秒內發生的切歌才顯示 (避免重整網頁時跳出舊訊息)
        if (Date.now() - msg.timestamp < 10000) {
          showSkipOverlay(msg);
        }
      }
    });
}

function showSkipOverlay(msg) {
  const overlay = document.getElementById('skipOverlay');
  const titleEl = document.getElementById('skipTitle');
  const reqEl = document.getElementById('skipRequester');
  const banEl = document.getElementById('banMessage');
  const reasonEl = document.getElementById('skipReasonDisplay');
  const imgEl = document.getElementById('skipImageDisplay');
  
  // 判斷是投票切歌還是管理員切歌
  if (msg.type === 'vote') {
    titleEl.innerText = "🗳 投票通過切歌";
    titleEl.style.borderColor = "#06c755";
    titleEl.style.color = "#06c755";
    reasonEl.innerText = `歌曲：${msg.title}`;
    imgEl.style.display = 'none';
  } else {
    titleEl.innerText = "🛑 管理員切歌";
    titleEl.style.borderColor = "#ff4444";
    titleEl.style.color = "#ff4444";
    reasonEl.innerText = msg.reason || '（無原因）';
    if (msg.image) { imgEl.src = msg.image; imgEl.style.display = 'block'; }
    else { imgEl.style.display = 'none'; }
  }

  // 顯示點歌者
  if (msg.requester && msg.requester !== '未知') {
    reqEl.innerText = `點歌者：${msg.requester}`;
    const duration = msg.banDuration || 5;
    banEl.innerText = `(點歌者已停權 ${duration} 分鐘)`;
    banEl.style.display = 'block';
  } else {
    reqEl.innerText = '';
    banEl.style.display = 'none';
  }
  
  overlay.style.display = 'flex';
  
  // 播放提示音
  playVoteSound();

  // 6 秒後自動消失
  setTimeout(() => { overlay.style.display = 'none'; }, 6000);
}

// 每 2 秒檢查一次是否有新訊息
setInterval(checkSkipMessage, 2000);
</script>

<script>

<script>
// --- 彈幕系統 ---
let lastDanmakuTime = Date.now();

function checkDanmaku() {
  fetch('/danmaku?since=' + lastDanmakuTime)
    .then(r => r.json())
    .then(msgs => {
      if (msgs && msgs.length > 0) {
        // 更新最後時間戳記
        const maxTime = Math.max(...msgs.map(m => m.timestamp));
        if (maxTime > lastDanmakuTime) lastDanmakuTime = maxTime;
        
        msgs.forEach((msg, i) => {
          // 稍微錯開顯示時間 (每則間隔 150ms)，避免瞬間重疊
          setTimeout(() => spawnDanmaku(msg), i * 150);
        });
      }
    })
    .catch(e => console.error(e));
}

function spawnDanmaku(msg) {
  const container = document.getElementById('danmaku-container');
  if (!container) return;
  
  const el = document.createElement('div');
  el.className = 'danmaku-item';
  el.innerText = msg.text;
  
  // 如果顏色是預設白色，則使用隨機亮色
  if (!msg.color || msg.color === '#ffffff' || msg.color === '#fff') {
    el.style.color = `hsl(${Math.floor(Math.random() * 360)}, 100%, 65%)`;
  } else {
    el.style.color = msg.color;
  }
  
  // 大小設定
  let fontSize = '36px';
  if (msg.size === 'small') fontSize = '24px';
  if (msg.size === 'large') fontSize = '64px';
  el.style.fontSize = fontSize;
  
  let duration = 4; // 預設動畫時間 (給 top/bottom 用)

  // 模式設定
  if (msg.mode === 'top') {
    el.classList.add('fixed-top');
    el.style.top = (10 + Math.random() * 10) + '%'; // 稍微隨機避免完全重疊
  } else if (msg.mode === 'bottom') {
    el.classList.add('fixed-bottom');
    el.style.bottom = (15 + Math.random() * 10) + '%';
  } else {
    // 預設滾動
    el.classList.add('scroll');
    el.style.top = Math.floor(Math.random() * 80) + '%';
    duration = 8 + Math.random() * 7;
    el.style.animationDuration = duration + 's';
  }
  
  container.appendChild(el);
  
  // 動畫結束後移除
  setTimeout(() => {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, duration * 1000 + 100);
}

// 每秒檢查一次彈幕
setInterval(checkDanmaku, 1000);
</script>
