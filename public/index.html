    /* Waves */
    .waves-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 20vh;
      z-index: -1;
      pointer-events: none;
      opacity: 0.8;
    }

    .waves {
      width: 100%;
      height: 100%;
      margin-bottom: -7px;
    }

    .parallax>use {
      animation: move-forever 25s cubic-bezier(.55, .5, .45, .5) infinite;
    }

    .parallax>use:nth-child(1) {
      animation-delay: -2s;
      animation-duration: 7s;
    }

    .parallax>use:nth-child(2) {
      animation-delay: -3s;
      animation-duration: 10s;
    }

    .parallax>use:nth-child(3) {
      animation-delay: -4s;
      animation-duration: 13s;
    }

    .parallax>use:nth-child(4) {
      animation-delay: -5s;
      animation-duration: 20s;
    }

    @keyframes move-forever {
      0% {
        transform: translate3d(-90px, 0, 0);
      }

      100% {
        transform: translate3d(85px, 0, 0);
      }
    }

    /* Animations for Room Page */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* Button Loading Spinner */
    @keyframes spin-load {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .btn-loading {
      position: relative;
      color: transparent !important;
      pointer-events: none;
    }

    .btn-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin-load 0.8s linear infinite;
    }

    @keyframes pulseGlow {
      0% {
        box-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
      }

      50% {
        box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
      }

      100% {
        box-shadow: 0 0 5px rgba(0, 255, 204, 0.3);
      }
    }

      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
      margin: 0;

    .top-icon-btn .icon {

    .top-icon-btn:hover {

      color: #fff;
      border-color: #00ffcc;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
      transform: translateY(-2px);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-wrapper input {
      padding-right: 50px;
    }

    .inner-icon-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .inner-icon-btn .icon {
      margin: 0 !important;
    }

    .playing-bar {
      width: 3px;
      background: #00ffcc;
      display: inline-block;
      margin: 0 1.5px;
      border-radius: 2px;
      animation: musicBar 1s infinite;
      transform-origin: bottom;
    }

    .playing-bar:nth-child(1) {
      animation-delay: 0s;
    }

    .playing-bar:nth-child(2) {
      animation-delay: 0.2s;
    }

    .playing-bar:nth-child(3) {
      animation-delay: 0.4s;
    }

    .playing-bar:nth-child(4) {
      animation-delay: 0.1s;
    }

    /* Enhance input and button transitions */
    input {
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

      outline: none;
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
      background: #1a1a1a;
      transform: translateY(-1px);
    }

    button {
      transition: all 0.3s ease;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 68, 68, 0.4);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 5px rgba(255, 68, 68, 0.4);
    }

    .search-result {
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }

    .search-result:hover {
      background: #1a1a1a;
      transform: scale(1.02);
      border-color: #00ffcc;
      box-shadow: 0 5px 15px rgba(0, 255, 204, 0.15);
    }

    .search-result img {
      transition: transform 0.3s ease;
    }

    .search-result:hover img {
      transform: scale(1.05);
    }

<script>
  // 自動將網址列的 ?room=xxx 參數帶入所有的 API 請求
  (function () {
    const originalFetch = window.fetch;
    window.fetch = function (url, options) {
      const room = new URLSearchParams(window.location.search).get('room') || 'default';
      // 處理相對路徑與絕對路徑
      let urlObj;
      try { urlObj = new URL(url, window.location.origin); } catch (e) { return originalFetch(url, options); }
      if (urlObj.origin !== window.location.origin) return originalFetch(url, options);
      urlObj.searchParams.append('room', room);
      return originalFetch(urlObj.toString(), options);
    };
  })();
</script>

    <h1 style="font-size:48px; margin-bottom:20px; color:#00ffcc; text-shadow: 0 0 20px rgba(0,255,204,0.5);">放歌啦 <svg
        width="20" height="20" style="vertical-align: middle; margin-right: 4px;" class="icon">
        <use href="#icon-music"></use>
      </svg>
    </h1>
    <p style="font-size:18px; color:#ccc; max-width:600px; margin:0 auto 40px;">
      免費的線上點歌系統，適合派對、活動、店家使用。<br>
      手機掃描 QR Code 即可點歌，支援 YouTube 搜尋、即時彈幕與燈光特效。
    </p>
    <button onclick="window.location.href='/create.html'"
      style="background:#007bff; font-size:24px; padding:15px 40px; border-radius:50px; box-shadow:0 0 20px rgba(0,123,255,0.5);">
      <svg width="24" height="24" style="vertical-align: middle; margin-right: 4px;" class="icon">
        <use href="#icon-rocket"></use>
      </svg>立即建立房間
    </button>
    <div style="margin-top:40px; font-size:14px; color:#666;">
      無需註冊，即開即用
    </div>
  </div>

  <div class="container room-anim" id="roomPage" style="display:none;">
    <h1 style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
      <div class="glow-title">
        <div style="display:flex; gap:8px; margin-right: 12px;">
          <button onclick="shareRoom()" class="top-icon-btn" title="分享此房間連結">
            <svg width="20" height="20" class="icon">
              <use href="#icon-share"></use>
            </svg>
          </button>
          <button onclick="goToPage('/admin.html')" class="top-icon-btn" title="管理後台">
            <svg width="20" height="20" class="icon">
              <use href="#icon-settings"></use>
            </svg>
          </button>
          <button onclick="goToPage('/display.html')" class="top-icon-btn" title="播放頁面">
            <svg width="20" height="20" class="icon">
              <use href="#icon-tv"></use>
            </svg>
          </button>
        </div>
        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
          style="animation: spin 3s linear infinite;">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#00ffcc" stroke-width="2" />
          <circle cx="12" cy="12" r="3" fill="#ff4444" />
          <path d="M12 2 a10 10 0 0 1 10 10" fill="none" stroke="#007bff" stroke-width="2" />
        </svg>
        手機點歌
      </div>
      <span id="globalUserInfo" style="font-size:12px; color:#06c755; font-weight:normal; text-shadow:none;"></span>
    </h1>

    <!-- 搜尋 -->
    <div class="input-wrapper">
      <input id="searchInput" placeholder="搜尋 YouTube 歌名或歌手…" onkeydown="if(event.key==='Enter') searchYT()">
      <button onclick="searchYT()" class="inner-icon-btn" title="搜尋">
        <svg width="20" height="20" class="icon">
          <use href="#icon-search"></use>
        </svg>
      </button>
    </div>
    <div id="searchList"></div>

    <hr>

    <!-- 貼連結 -->
    <div class="input-wrapper">
      <input id="urlInput" placeholder="或貼上 YouTube 連結（可選）" onkeydown="if(event.key==='Enter') sendRequestFromInput()">
      <button onclick="sendRequestFromInput()" class="inner-icon-btn" title="貼上加入佇列">
        <svg width="20" height="20" class="icon" style="transform: translateX(-1px);">
          <use href="#icon-send"></use>
        </svg>
      </button>
    </div>
    <div id="msg"></div>

    <hr>

    <!-- 投票切歌區塊 -->
    <div id="voteSection"
      style="display:none; background:#1a1a1a; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #333; position:relative; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.4);">
      <div style="font-size:13px; color:#aaa; display:flex; align-items:center; gap:6px; margin-bottom:10px;">
        <svg width="20" height="20" style="vertical-align: middle; margin-right: 4px;" class="icon">
          <use href="#icon-music"></use>
        </svg>正在播放
        <div style="display:flex; align-items:flex-end; height:14px;">
          <span class="playing-bar"></span><span class="playing-bar"></span><span class="playing-bar"></span><span
            class="playing-bar"></span>
        </div>
      </div>

      <div style="display: flex; align-items: flex-start; margin-bottom: 12px;">
        <img id="npThumbnail" src=""
          style="width: 100px; height: 56px; object-fit: cover; border-radius: 6px; margin-right: 12px; flex-shrink: 0; display: none;">
        <div class="queue-info">
          <div id="npTitle" class="queue-title" style="font-size: 15px; margin: 0;">載入中...</div>
          <div id="npChannel" class="queue-channel" style="margin-top: 4px;"></div>
        </div>
      </div>

      <!-- LINE 登入與投票控制區 -->
      <button onclick="voteSkip()" class="btn-vote"
        style="width: 100%; border-radius: 6px; padding: 10px; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center; position: relative;"><svg
          width="18" height="18" style="vertical-align: middle; margin-right: 6px;" class="icon">
          <use href="#icon-vote"></use>
        </svg>投票切歌 <span id="voteCount" style="margin-left: 4px;"></span></button>
    </div>

    <!-- 彈幕發送區塊 -->
    <div style="background:#1a1a1a; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #333;">
      <div style="font-size:13px; color:#aaa;"><svg width="16" height="16"
          style="vertical-align: middle; margin-right: 4px;" class="icon">
          <use href="#icon-message"></use>
        </svg>發送彈幕</div>
      <div style="display:flex; gap:8px; margin-top:5px;">
        <input id="danmakuInput" placeholder="輸入彈幕內容..." style="flex:1; margin:0;">
        <input type="color" id="danmakuColor" value="#ffffff"
          style="width:40px; padding:0; height:44px; border:none; background:none; cursor:pointer;">
        <button onclick="sendDanmaku()" style="width:auto; margin:0; background:#007bff;">發送</button>
      </div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <select id="danmakuSize"
          style="flex:1; padding:8px; background:#333; color:#fff; border:1px solid #555; border-radius:4px;">
          <option value="small">字體：小</option>
          <option value="medium" selected>字體：中</option>
          <option value="large">字體：大</option>
        </select>
        <select id="danmakuMode"
          style="flex:1; padding:8px; background:#333; color:#fff; border:1px solid #555; border-radius:4px;">
          <option value="scroll" selected>模式：滾動</option>
          <option value="top">模式：頂部</option>
          <option value="bottom">模式：底部</option>
        </select>
        <input type="number" id="danmakuQuantity" value="1" min="1" max="20"
          style="width:60px; padding:8px; background:#333; color:#fff; border:1px solid #555; border-radius:4px; text-align:center;"
          placeholder="數量">
      </div>
    </div>

    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
        <div class="small" style="margin:0;">目前排隊：</div>
        <div onclick="showLeaderboard()"
          style="font-size:13px; color:#ffeb3b; cursor:pointer; padding:4px 8px; background:#333; border-radius:4px; border:1px solid #444;">
          <svg width="20" height="20" style="vertical-align: middle; margin-right: 4px;" class="icon">
            <use href="#icon-trophy"></use>
          </svg>查看排行榜
        </div>
      </div>
      <ul id="queueList"></ul>
    </div>
  </div>

  <script src="request.js"></script>
  <script>
    // --- 頁面路由邏輯 ---
    const currentRoom = new URLSearchParams(window.location.search).get('room');
    if (!currentRoom) {
      document.getElementById('landingPage').style.display = 'block';
      document.getElementById('loginOverlay').style.display = 'none';
    } else {
      document.getElementById('roomPage').style.display = 'block';
    }

    // --- 全域設定 ---
    window.APP_CONFIG = {};
    let currentLineProfile = null;

    function initLiff() {
      // 本地測試 Bypass 機制: 若網址帶有 ?bypassLogin=1，就建立假的 LINE Profile
      if (new URLSearchParams(window.location.search).get('bypassLogin') === '1') {
        console.log('Bypass Login Enabled: 正在使用本地假資料登入');
        currentLineProfile = {
          userId: 'test_user_' + Math.floor(Math.random() * 10000),
          displayName: '本地測試員',
          pictureUrl: 'https://ui-avatars.com/api/?name=測試&background=ff4444&color=fff'
        };
        sessionStorage.setItem('line_user_id', currentLineProfile.userId);
        updateLoginUI();
        return;
      }

      liff.init({ liffId: window.APP_CONFIG.LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(profile => {
            currentLineProfile = profile;
            // 儲存 ID 到 sessionStorage，讓 admin.html 可以共用登入狀態
            sessionStorage.setItem('line_user_id', profile.userId);
            updateLoginUI();
          }).catch(err => {
            console.error('取得個資失敗', err);
            // 若取得個資失敗，顯示登入按鈕讓使用者重試
            updateLoginUI();
          });
        } else {
          updateLoginUI();
        }
      }).catch(err => {
        console.error('LIFF 初始化失敗 (請檢查 LIFF ID)', err);
        showToast('初始化失敗', '請檢查網路連線或重新整理頁面。', 'error');
      });
    }

    function handleLineLogin() {
      const btn = document.querySelector('button[onclick="handleLineLogin()"]');
      if (btn) btn.classList.add('btn-loading');
      try {
        if (liff.isInClient()) {
          // 情境 1: 已經在 LINE App 內 (LIFF 瀏覽器)
          // 直接登入，不需指定 redirectUri，避免參數錯誤導致無反應
          liff.login();
        } else {
          // 情境 2: 外部瀏覽器
          const url = new URL(window.location.href);
          // 清除可能存在的舊參數，避免干擾
          url.searchParams.delete('code');
          url.searchParams.delete('state');
          url.searchParams.delete('liffClientId');
          url.searchParams.delete('liffRedirectUri');
          url.searchParams.delete('from_liff');

          const isAndroid = /Android/i.test(navigator.userAgent);
          if (isAndroid) {
            // Android: 強制使用 LIFF URL 嘗試喚起 App (解決 Chrome 阻擋問題)
            window.location.href = `https://liff.line.me/${window.APP_CONFIG.LIFF_ID}${url.search}`;
          } else {
            // iOS / 電腦: 使用 SDK 標準登入 (iOS 較新版本對 Universal Link 支援變更，SDK 處理較穩)
            liff.login({ redirectUri: url.toString() });
          }
        }
      } catch (err) {
        showToast('登入錯誤', err.message || err, 'error');
        if (btn) btn.classList.remove('btn-loading');
      }
    }

    function updateLoginUI() {
      const overlay = document.getElementById('loginOverlay');
      const globalUser = document.getElementById('globalUserInfo');

      // 如果沒有房間代碼 (Landing Page)，就不顯示登入遮罩
      if (!currentRoom) {
        overlay.style.display = 'none';
        return;
      }

      if (currentLineProfile) {
        overlay.style.display = 'none';
        globalUser.innerText = `Hi, ${currentLineProfile.displayName}`;
      } else {
        overlay.style.display = 'flex';
        globalUser.innerText = '';
      }
    }

    // 取得設定後啟動
    async function initializeConfig() {
      try {
        const res = await fetch('/api/config');
        window.APP_CONFIG = await res.json();

        // 動態載入 reCAPTCHA script
        const script = document.createElement('script');
        script.src = `https://www.google.com/recaptcha/api.js?render=${window.APP_CONFIG.RECAPTCHA_SITE_KEY}`;
        document.head.appendChild(script);

        // 初始化 LIFF
        initLiff();
      } catch (err) {
        console.error('Failed to load config', err);
      }
    }
    initializeConfig();


    // 投票切歌功能
    function voteSkip() {
      // 檢查 LINE 登入狀態
      if (!currentLineProfile) {
        showToast('需要登入', '請先登入 LINE 才能投票', 'warn');
        handleLineLogin();
        return;
      }

      const btn = document.querySelector('button[onclick="voteSkip()"]');
      if (btn) btn.classList.add('btn-loading');

      // 觸發 reCAPTCHA v3
      grecaptcha.ready(function () {
        grecaptcha.execute(window.APP_CONFIG.RECAPTCHA_SITE_KEY, { action: 'vote' }).then(function (token) {
          executeVoteSkip(token, btn);
        });
      });
    }

    function executeVoteSkip(captchaResponse, btnElement) {
      // 使用 LINE User ID 作為識別
      const clientId = currentLineProfile.userId;

      fetch('/vote-skip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId: clientId, captcha: captchaResponse })
      })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            showToast('已投票', data.message || '投票切歌成功', 'success');
            updateVoteStatus();
          } else {
            showToast('投票失敗', data.error || '無法投票', 'error');
          }
        })
        .catch(() => {
          showToast('錯誤', '投票登入失敗，請稍後再試', 'error');
        })
        .finally(() => {
          if (btnElement) btnElement.classList.remove('btn-loading');
        });
    }

    // 更新正在播放與票數狀態
    function updateVoteStatus() {
      fetch('/queue').then(r => r.json()).then(queue => {
        const voteSection = document.getElementById('voteSection');
        if (queue && queue.length > 0) {
          voteSection.style.display = 'block';

          document.getElementById('npTitle').innerText = queue[0].title || '未知歌曲';
          document.getElementById('npChannel').innerText = queue[0].channel || '';

          const thumbEl = document.getElementById('npThumbnail');
          if (queue[0].thumbnail) {
            thumbEl.src = queue[0].thumbnail;
            thumbEl.style.display = 'block';
          } else {
            thumbEl.style.display = 'none';
          }

          const votes = queue[0].votes || 0;
          document.getElementById('voteCount').innerText = `(${votes} 票)`;
        } else {
          voteSection.style.display = 'none';
        }
      });
    }
    setInterval(updateVoteStatus, 3000);
    updateVoteStatus();

    // --- 排行榜功能 ---
    let currentLeaderboardTab = 'users';

    function showLeaderboard() {
      const overlay = document.getElementById('leaderboardOverlay');
      overlay.style.display = 'flex';
      switchLeaderboard(currentLeaderboardTab);
    }

    function switchLeaderboard(type) {
      currentLeaderboardTab = type;
      const list = document.getElementById('leaderboardList');
      list.innerHTML = '<div style="text-align:center; color:#777; padding:20px;">載入中...</div>';

      // Update tabs UI
      const tabUsers = document.getElementById('tab-users');
      const tabSongs = document.getElementById('tab-songs');
      if (type === 'users') {
        tabUsers.style.background = '#444'; tabUsers.style.color = '#fff'; tabUsers.style.border = 'none'; tabUsers.style.fontWeight = 'bold';
        tabSongs.style.background = '#222'; tabSongs.style.color = '#aaa'; tabSongs.style.border = '1px solid #444'; tabSongs.style.fontWeight = 'normal';
      } else {
        tabSongs.style.background = '#444'; tabSongs.style.color = '#fff'; tabSongs.style.border = 'none'; tabSongs.style.fontWeight = 'bold';
        tabUsers.style.background = '#222'; tabUsers.style.color = '#aaa'; tabUsers.style.border = '1px solid #444'; tabUsers.style.fontWeight = 'normal';
      }

      const endpoint = type === 'users' ? '/leaderboard' : '/leaderboard/songs';

      fetch(endpoint)
        .then(r => r.json())
        .then(data => {
          list.innerHTML = '';
          if (!data || data.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#777; padding:20px;">目前沒有資料</div>';
            return;
          }

          data.forEach((user, idx) => {
            const row = document.createElement('div');
            row.style.cssText = 'display:flex; align-items:center; padding:12px 0; border-bottom:1px solid #333;';

            let rankColor = '#888';
            let rankIcon = idx + 1;
            if (idx === 0) { rankColor = '#ffd700'; rankIcon = '<svg width="20" height="20" style="vertical-align: middle; margin-right: 4px;" class="icon"><use href="#icon-medal1"></use></svg>'; }
            else if (idx === 1) { rankColor = '#c0c0c0'; rankIcon = '<svg width="20" height="20" style="vertical-align: middle; margin-right: 4px;" class="icon"><use href="#icon-medal2"></use></svg>'; }
            else if (idx === 2) { rankColor = '#cd7f32'; rankIcon = '<svg width="20" height="20" style="vertical-align: middle; margin-right: 4px;" class="icon"><use href="#icon-medal3"></use></svg>'; }

            if (type === 'users') {
              row.innerHTML = `
              <div style="width:30px; text-align:center; font-weight:bold; color:${rankColor}; font-size:16px;">${rankIcon}</div>
              <img src="${user.picture || 'https://via.placeholder.com/40'}" style="width:36px; height:36px; border-radius:50%; margin:0 10px; object-fit:cover; background:#333;">
              <div style="flex:1; overflow:hidden;">
                <div style="color:#fff; font-size:14px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${user.name || '未知'}</div>
                <div style="color:#aaa; font-size:11px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${user.lastSong ? '<svg width="20" height="20" style="vertical-align: middle; margin-right: 4px;" class="icon"><use href="#icon-music"></use></svg>' + user.lastSong : ''}</div>
              </div>
              <div style="color:#06c755; font-weight:bold; font-size:14px;">${user.count} 首</div>
            `;
            } else {
              row.innerHTML = `
              <div style="width:30px; text-align:center; font-weight:bold; color:${rankColor}; font-size:16px;">${rankIcon}</div>
              <img src="${user.thumbnail || 'https://via.placeholder.com/40'}" style="width:50px; height:28px; border-radius:4px; margin:0 10px; object-fit:cover; background:#333;">
              <div style="flex:1; overflow:hidden;">
                <div style="color:#fff; font-size:13px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${user.title || '未知'}</div>
              </div>
              <div style="color:#ff4444; font-weight:bold; font-size:14px;">${user.count} 次</div>
            `;
            }
            list.appendChild(row);
          });
        })
        .catch(err => {
          console.error(err);
          list.innerHTML = '<div style="text-align:center; color:#ff4444; padding:20px;">載入失敗</div>';
        });
    }

    function closeLeaderboard() {
      document.getElementById('leaderboardOverlay').style.display = 'none';
    }

    // --- 彈幕功能 ---
    function sendDanmaku() {
      const input = document.getElementById('danmakuInput');
      const colorInput = document.getElementById('danmakuColor');
      const sizeInput = document.getElementById('danmakuSize');
      const modeInput = document.getElementById('danmakuMode');
      const quantityInput = document.getElementById('danmakuQuantity');
      const text = input.value.trim();

      if (!text) {
        showToast('提示', '請輸入彈幕內容', 'warn');
        return;
      }

      const btn = document.querySelector('button[onclick="sendDanmaku()"]');
      if (btn) btn.classList.add('btn-loading');

      fetch('/danmaku', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, color: colorInput.value, size: sizeInput.value, mode: modeInput.value, quantity: quantityInput.value })
      })
        .then(r => r.json())
        .then(data => {
          if (data.ok) {
            input.value = '';
            showToast('已發送', '彈幕發送成功', 'success');
          } else {
            showToast('發送失敗', data.error || '未知的錯誤', 'error');
          }
        })
        .catch(err => showToast('發送失敗', '請稍後再試', 'error'))
        .finally(() => {
          if (btn) btn.classList.remove('btn-loading');
        });
    }

    // --- 分享功能 ---
    function shareRoom() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: '放歌啦 - 手機點歌',
          text: '快來這個房間點歌！',
          url: url
        }).catch(console.error);
      } else {
        navigator.clipboard.writeText(url).then(() => showToast('已複製', '連結已複製到剪貼簿！', 'success'));
      }
    }

    function goToPage(path) {
      const room = new URLSearchParams(window.location.search).get('room');
      if (room) {
        window.location.href = `${path}?room=${encodeURIComponent(room)}`;
      } else {
        window.location.href = path;
      }
    }
  </script>

  <!-- Background Waves -->
  <div class="waves-container">
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
        <linearGradient id="wave-grad-1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#007bff" stop-opacity="0.3" />
        </linearGradient>
        <linearGradient id="wave-grad-2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ff4444" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#ff00cc" stop-opacity="0.3" />
        </linearGradient>
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" fill="url(#wave-grad-1)" />
        <use xlink:href="#gentle-wave" x="48" y="3" fill="url(#wave-grad-2)" />
        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(0, 255, 204, 0.2)" />
        <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(0, 123, 255, 0.1)" />
      </g>
    </svg>
  </div>
