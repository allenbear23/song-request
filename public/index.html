<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>點歌系統</title>
  <style>
    body {
      font-family: Arial;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f8f8f8;
    }
    input, button {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      margin-top: 10px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056d2;
    }
    .msg {
      margin-top: 20px;
      font-size: 20px;
      color: green;
      text-align: center;
    }
  </style>
</head>

<body>

<h1>🎵 點歌系統</h1>
<p>請貼上 YouTube 連結：</p>

<input id="urlInput" type="text" placeholder="例如：https://www.youtube.com/watch?v=xxxxxx">
<button onclick="sendRequest()">送出點歌</button>

<div class="msg" id="msg"></div>

<script>
function isValidYouTube(url) {
  return url.includes("youtube.com/watch?v=") || url.includes("youtu.be/");
}

function sendRequest() {
  const url = document.getElementById("urlInput").value.trim();

  if (!isValidYouTube(url)) {
    document.getElementById("msg").innerText = "❌ 請輸入有效的 YouTube 連結！";
    return;
  }

  fetch("/request", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("msg").innerText = "✔️ 歌曲已送出！";
    document.getElementById("urlInput").value = "";
  })
  .catch(() => {
    document.getElementById("msg").innerText = "❌ 傳送失敗，請稍後再試";
  });
}
</script>

</body>
</html>
