<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>點歌系統</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family:Arial; max-width:720px; margin:20px auto; padding:10px; background:#0b0b0b; color:#fff; }
input,button{width:100%;padding:12px;margin-top:10px;border-radius:6px;border:none;}
input{background:#111;color:#fff;} button{background:#ff4444;color:#fff;font-weight:bold; cursor:pointer;}
.search-result{display:flex;background:#121212;padding:10px;margin-top:8px;border-radius:8px;cursor:pointer;}
.search-result img{width:120px;height:70px;object-fit:cover;margin-right:12px;border-radius:6px;}
.title{font-weight:bold;} .channel{color:#aaa;font-size:13px;margin-top:4px;}
#msg{margin-top:10px;color:#7fffd4;}
#queueList li{margin-top:8px;font-size:14px;color:#fff;}
</style>
</head>
<body>
<h1>🎤 點歌系統</h1>
<input id="searchInput" placeholder="搜尋 YouTube 歌名…">
<button onclick="searchYT()">搜尋</button>
<div id="searchList"></div>
<hr>
<input id="urlInput" placeholder="或貼上 YouTube 連結">
<button onclick="sendRequestFromInput()">貼上加入佇列</button>
<div id="msg"></div>
<hr>
<ul id="queueList"></ul>
<script src="request.js"></script>
</body>
</html>
