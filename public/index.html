<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>點歌系統</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8f8f8; }
    input, button { width: 100%; padding: 12px; font-size: 18px; margin-top: 10px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056d2; }
    .msg { margin-top: 20px; font-size: 20px; color: green; text-align: center; }
    #queue { margin-top: 30px; text-align: left; }
    #queue h3 { margin-bottom: 5px; }
    #queue ul { list-style: none; padding-left: 0; }
    #queue li { font-size: 16px; margin-bottom: 3px; }
  </style>
</head>
<body>

<h1>🎵 點歌系統</h1>
<p>請貼上 YouTube 連結：</p>

<input id="urlInput" type="text" placeholder="例如：https://www.youtube.com/watch?v=xxxxxx">
<button onclick="sendRequest()">送出點歌</button>

<div class="msg" id="msg"></div>

<div id="queue">
  <h3>目前排隊：</h3>
  <ul id="queueList"></ul>
</div>

<script>
function isValidYouTube(url) {
  return url.includes("youtube.com/watch?v=") || url.includes("youtu.be/");
}

// 發送點歌
function sendRequest() {
  const url = document.getElementById("urlInput").value.trim();
  if (!isValidYouTube(url)) {
    document.getElementById("msg").innerText = "❌ 請輸入有效的 YouTube 連結！";
    return;
  }

  fetch("/request", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  })
  .then(res => res.json())
  .then(() => {
    document.getElementById("msg").innerText = "✔️ 歌曲已送出！";
    document.getElementById("urlInput").value = "";
    updateQueue();
  })
  .catch(() => {
    document.getElementById("msg").innerText = "❌ 傳送失敗，請稍後再試";
  });
}

// 更新排隊列表
function updateQueue() {
  fetch("/queue")
    .then(res => res.json())
    .then(data => {
      const ul = document.getElementById("queueList");
      ul.innerHTML = "";
      data.forEach((item, index) => {
        const li = document.createElement("li");
        li.innerText = `${index + 1}. ${item.url}`;
        ul.appendChild(li);
      });
    });
}

// 定時更新排隊列表
setInterval(updateQueue, 5000);

// 頁面載入時先更新一次
updateQueue();
</script>

</body>
</html>
