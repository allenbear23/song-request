<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>手機點歌</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { font-family: Arial; max-width: 720px; margin: 18px auto; padding: 14px; background: #0b0b0b; color: #f5f5f5; }
.container { background: #0f0f0f; padding: 14px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
/* LINE 登入按鈕樣式 */
#lineLoginBtn { background: #06c755; color: #fff; font-weight: bold; }
h1 { margin: 6px 0 12px; font-size: 20px; color: #fff; }
input, button { width: 100%; padding: 12px; font-size: 16px; margin-top: 8px; border-radius:6px; border: none; }
input { background: #111; color: #fff; }
button { background: #ff4444; color: #fff; font-weight: bold; }
.small { font-size: 13px; color: #bbb; margin-top: 8px; }
.search-result { display:flex; background:#121212; padding:10px; margin-top:8px; border-radius:8px; cursor:pointer; }
.search-result img { width:120px; height:70px; object-fit:cover; margin-right:10px; border-radius:6px; }
.title { font-weight:700; color:#fff; }
.channel { color:#aaa; font-size:13px; margin-top:6px; }
#msg { margin-top:10px; color:#7fffd4; font-weight:600; }
#queueList li { margin-top:8px; color:#fff; font-size:14px; }
hr { border:0; height:1px; background:#222; margin:12px 0; }
</style>
</head>
<!-- 引入 LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<body>
  <!-- public/index.html (加入於 <head> 或 <body> 之前) -->
<!-- 使用 reCAPTCHA v2 Invisible（使用 grecaptcha.execute 取得 token）-->

<div class="container">
  <h1>手機點歌</h1>

  <!-- 搜尋 -->
  <input id="searchInput" placeholder="搜尋 YouTube 歌名或歌手…" >
  <button onclick="searchYT()">搜尋</button>
  <div id="searchList"></div>
  <div class="g-recaptcha"
     data-sitekey="6LdVAxAsAAAAACKS0uVjLqmJS4FE7-qthguwBcYv">
</div>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>


  <hr>

  <!-- 貼連結 -->
  <input id="urlInput" placeholder="或貼上 YouTube 連結（可選）">
  <button onclick="sendRequestFromInput()">貼上加入佇列</button>
  <div id="msg"></div>

  <hr>

  <!-- 投票切歌區塊 -->
  <div id="voteSection" style="display:none; background:#1a1a1a; padding:12px; border-radius:8px; margin-bottom:12px; border:1px solid #333;">
    <div style="font-size:13px; color:#aaa;">🎵 正在播放</div>
    <div id="npTitle" style="font-weight:bold; margin:5px 0; color:#fff;">載入中...</div>
    
    <!-- LINE 登入與投票控制區 -->
    <button id="lineLoginBtn" onclick="handleLineLogin()" style="display:none;">LINE 登入以投票</button>
    <div id="voteControlArea" style="display:none;">
      <div id="lineUserInfo" style="font-size:12px; color:#06c755; margin-top:5px;"></div>
      <button onclick="voteSkip()" style="background:#333; border:1px solid #555; margin-top:5px;">🗳 投票切歌 <span id="voteCount"></span></button>
    </div>
  </div>

  <div>
    <div class="small">目前排隊：</div>
    <ul id="queueList"></ul>
  </div>
</div>

<script src="request.js"></script>
<script>
  // --- LINE LIFF 設定 ---
  // ⚠️ 請將此處替換為你在 LINE Developers 申請的 LIFF ID
  const LIFF_ID = '2008832076-eA3l2ogi'; 
  let currentLineProfile = null;

  function initLiff() {
    liff.init({ liffId: LIFF_ID }).then(() => {
      if (liff.isLoggedIn()) {
        liff.getProfile().then(profile => {
          currentLineProfile = profile;
          updateLoginUI();
        }).catch(err => {
          console.error('取得個資失敗', err);
          // 若取得個資失敗，顯示登入按鈕讓使用者重試
          updateLoginUI();
        });
      } else {
        updateLoginUI();
      }
    }).catch(err => {
      console.error('LIFF 初始化失敗 (請檢查 LIFF ID)', err);
      alert('LINE 登入元件初始化失敗，請檢查網路連線或重新整理頁面。\n錯誤訊息: ' + err);
    });
  }

  function handleLineLogin() {
    try {
      if (liff.isInClient()) {
        // 情境 1: 已經在 LINE App 內 (LIFF 瀏覽器)
        // 直接登入，不需指定 redirectUri，避免參數錯誤導致無反應
        liff.login();
      } else {
        // 情境 2: 外部瀏覽器 (Chrome/Safari)
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          // 手機外部瀏覽器 -> 跳轉 LIFF URL 喚起 LINE App
          window.location.href = `https://liff.line.me/${LIFF_ID}`;
        } else {
          // 電腦版 -> 一般網頁登入
          liff.login();
        }
      }
    } catch (err) {
      alert('無法啟動登入: ' + err);
    }
  }

  function updateLoginUI() {
    const loginBtn = document.getElementById('lineLoginBtn');
    const voteArea = document.getElementById('voteControlArea');
    const userInfo = document.getElementById('lineUserInfo');

    if (currentLineProfile) {
      loginBtn.style.display = 'none';
      voteArea.style.display = 'block';
      userInfo.innerText = `Hi, ${currentLineProfile.displayName}`;
    } else {
      loginBtn.style.display = 'block';
      voteArea.style.display = 'none';
    }
  }

  // 啟動 LIFF
  initLiff();

  // 投票切歌功能
  function voteSkip() {
    // 檢查 reCAPTCHA 是否已勾選
    const captchaResponse = grecaptcha.getResponse();
    if (!captchaResponse) {
      alert('請先勾選「我不是機器人」');
      return;
    }

    // 檢查 LINE 登入狀態
    if (!currentLineProfile) {
      alert('請先登入 LINE 才能投票');
      handleLineLogin();
      return;
    }
    // 使用 LINE User ID 作為識別
    const clientId = currentLineProfile.userId;

    fetch('/vote-skip', { 
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId: clientId, captcha: captchaResponse })
    })
      .then(r => r.json())
      .then(data => {
        grecaptcha.reset(); // 重置驗證碼，準備下一次使用
        if (data.ok) {
          alert(data.message || '已投票');
          updateVoteStatus();
        } else {
          alert(data.error || '投票失敗');
        }
      })
      .catch(() => {
        grecaptcha.reset();
        alert('投票失敗，請稍後再試');
      });
  }

  // 更新正在播放與票數狀態
  function updateVoteStatus() {
    fetch('/queue').then(r => r.json()).then(queue => {
      const voteSection = document.getElementById('voteSection');
      if (queue && queue.length > 0) {
        voteSection.style.display = 'block';
        document.getElementById('npTitle').innerText = queue[0].title;
        const votes = queue[0].votes || 0;
        document.getElementById('voteCount').innerText = `(${votes} 票)`;
      } else {
        voteSection.style.display = 'none';
      }
    });
  }
  setInterval(updateVoteStatus, 3000);
  updateVoteStatus();
</script>
</body>
</html>
