<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>點歌系統</title>
<style>
body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; background:#f8f8f8; }
input, button { width: 100%; padding: 12px; font-size: 18px; margin-top: 10px; }
button { background:#007bff; color:white; border:none; cursor:pointer; }
button:hover { background:#0056d2; }
#msg { margin-top: 20px; font-size: 18px; color:green; text-align:center; }
#queue { margin-top: 20px; }
#queue ul { list-style:none; padding-left:0; }
#queue li { font-size:16px; margin-bottom:3px; }
</style>
</head>
<body>

<h1>🎵 點歌系統</h1>
<input id="urlInput" type="text" placeholder="貼上 YouTube 連結">
<button onclick="sendRequest()">送出點歌</button>
<div id="msg"></div>

<div id="queue">
<h3>目前排隊：</h3>
<ul id="queueList"></ul>
</div>

<script src="request.js"></script>
</body>
</html>
