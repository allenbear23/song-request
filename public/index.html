<div id="queue">
<h3>目前排隊：</h3>
<ul id="queueList"></ul>
</div>
<script>
function updateQueue(){ fetch("/queue").then(res=>res.json()).then(data=>{
  const ul=document.getElementById("queueList"); ul.innerHTML="";
  data.forEach((item,index)=>{
    const li=document.createElement("li");
    li.innerText=`${index+1}. ${item.title}`;
    ul.appendChild(li);
  });
}); }
setInterval(updateQueue,5000); updateQueue();
</script>
